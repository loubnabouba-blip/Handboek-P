<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handboek WWM op straat</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12306b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Politiehandboek: gedeelde opmaak. Eén ontwerp: koel papier, inktblauw, per reeks een eigen kleur. */
:root{
 --bg:#f1f4f9;--card:#ffffff;--ink:#0f1a2e;--muted:#566176;--line:#dce1ea;
 --acc:#1647c8;--accbg:#e6ecff;
 --ok:#0b7a4b;--okbg:#e1f5ea;--no:#b42318;--nobg:#fdeceb;--warn:#8a5a00;--warnbg:#fff3d1;
 --tip:#0b6b8a;--tipbg:#e0f3f9;--truc:#6b2fb3;--trucbg:#f0e7fb;
 --r1:#1647c8;--r2:#0b7a74;--r3:#b45309;--r4:#7c3aed;--rk:var(--r1);
 --fh:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --fb:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0b111f;--card:#141d31;--ink:#e9eefa;--muted:#9ba7bf;--line:#26314b;
 --acc:#8db0ff;--accbg:#1b2950;
 --ok:#6ee0a6;--okbg:#0f2e1f;--no:#ff9d93;--nobg:#3a1714;--warn:#ffd277;--warnbg:#3a2c0a;
 --tip:#7fd6f0;--tipbg:#0f2c38;--truc:#c9a4ff;--trucbg:#2a1d44;
 --r1:#8db0ff;--r2:#5fd6cd;--r3:#ffb866;--r4:#c4a5ff;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0b111f;--card:#141d31;--ink:#e9eefa;--muted:#9ba7bf;--line:#26314b;
 --acc:#8db0ff;--accbg:#1b2950;
 --ok:#6ee0a6;--okbg:#0f2e1f;--no:#ff9d93;--nobg:#3a1714;--warn:#ffd277;--warnbg:#3a2c0a;
 --tip:#7fd6f0;--tipbg:#0f2c38;--truc:#c9a4ff;--trucbg:#2a1d44;
 --r1:#8db0ff;--r2:#5fd6cd;--r3:#ffb866;--r4:#c4a5ff;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.r1{--rk:var(--r1)}.r2{--rk:var(--r2)}.r3{--rk:var(--r3)}.r4{--rk:var(--r4)}
a{color:var(--acc)}
.wrap{max-width:760px;margin:0 auto}
.wrap.wide{max-width:1040px}
/* kop */
.top{padding:14px 0 6px}
.crumb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.82rem;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none;font-weight:600}
.crumb a:hover{color:var(--ink)}
.rk{display:inline-block;font:700 .7rem/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--rk);border:1.5px solid var(--rk);border-radius:6px;padding:4px 7px}
h1{font:700 1.65rem/1.15 var(--fh);margin:10px 0 4px;text-wrap:balance;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted);font-size:.95rem}
.sw{display:flex;gap:6px;margin:12px 0 4px}
.sw a{flex:1;text-align:center;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 .9rem var(--fb);text-decoration:none}
.sw a[aria-current=page]{background:var(--rk);border-color:var(--rk);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sw a[aria-current=page]{color:#0b111f}}
:root[data-theme="dark"] .sw a[aria-current=page]{color:#0b111f}
.chipwet{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chipwet a{font-size:.76rem;font-weight:600;text-decoration:none;background:var(--accbg);color:var(--acc);border-radius:999px;padding:4px 10px}
/* sticky nav */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 0;border-bottom:1px solid var(--line);scrollbar-width:none;margin:8px 0 12px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button,nav.tabs a{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:999px;font:600 .86rem var(--fb);cursor:pointer;text-decoration:none}
nav.tabs [aria-selected=true]{background:var(--rk);border-color:var(--rk);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs [aria-selected=true]{color:#0b111f}}
:root[data-theme="dark"] nav.tabs [aria-selected=true]{color:#0b111f}
/* kaarten en tekst */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;min-width:0}
.card h2{font:700 1.02rem var(--fh);margin:0 0 8px}
.mn{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:600;margin-bottom:12px;font-size:.92rem}
.small{font-size:.82rem;color:var(--muted)}
main section{margin:0 0 26px;scroll-margin-top:60px}
main section>h2{font:700 1.3rem/1.2 var(--fh);margin:0 0 10px;display:flex;gap:10px;align-items:baseline;text-wrap:balance}
main section>h2 .n{flex:none;font:700 .8rem var(--fb);color:var(--rk);border:1.5px solid var(--rk);border-radius:7px;padding:2px 7px}
main p{margin:0 0 10px}
main ul,main ol{margin:0 0 12px;padding-left:1.3em}
main li{margin-bottom:4px}
.lead{font-size:1.05rem;color:var(--ink)}
.goals{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0 16px}
.goals b{font:700 .72rem var(--fb);text-transform:uppercase;letter-spacing:.06em;color:var(--rk)}
.goals ul{margin:6px 0 0}
/* callouts */
.co{border-radius:12px;padding:10px 14px;margin:0 0 12px;border-left:5px solid}
.co .l{display:block;font:800 .7rem var(--fb);letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.co.tip{background:var(--tipbg);border-color:var(--tip)}.co.tip .l{color:var(--tip)}
.co.truc{background:var(--trucbg);border-color:var(--truc)}.co.truc .l{color:var(--truc)}
.co.let{background:var(--nobg);border-color:var(--no)}.co.let .l{color:var(--no)}
.co.wet{background:var(--accbg);border-color:var(--acc)}.co.wet .l{color:var(--acc)}
/* tabel */
.tw{overflow-x:auto;margin:0 0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top;min-width:90px}
tr:first-child td{border-top:0}
th{font:700 .7rem var(--fb);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-top:0;background:var(--bg)}
/* stappen */
ol.st{list-style:none;padding:0;margin:0 0 12px;counter-reset:s}
ol.st li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
ol.st li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--rk);color:#fff;font:700 .85rem var(--fb);display:grid;place-items:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) ol.st li::before{color:#0b111f}}
:root[data-theme="dark"] ol.st li::before{color:#0b111f}
ol.st li div{min-width:0}
ol.st b{display:block}
/* vs wel/niet */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
@media (max-width:520px){.vs{grid-template-columns:1fr}}
.vs>div{border-radius:12px;padding:10px 14px;min-width:0}
.vs .y{background:var(--okbg)}.vs .n{background:var(--nobg)}
.vs h4{margin:0 0 4px;font:800 .72rem var(--fb);letter-spacing:.06em;text-transform:uppercase}
.vs .y h4{color:var(--ok)}.vs .n h4{color:var(--no)}
.vs ul{margin:0;padding-left:1.1em;font-size:.92rem}
/* dl */
dl.df{margin:0 0 12px;display:grid;gap:0}
dl.df div{display:grid;grid-template-columns:minmax(90px,28%) 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
dl.df div:first-child{border-top:0}
dl.df dt{font-weight:700}dl.df dd{margin:0}
@media (max-width:480px){dl.df div{grid-template-columns:1fr;gap:2px}}
/* casus + quiz */
details.casus{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 12px}
details.casus>summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center}
details.casus>summary::-webkit-details-marker{display:none}
details.casus>summary::before{content:"CASUS";font:800 .66rem var(--fb);letter-spacing:.07em;color:var(--rk);border:1.5px solid var(--rk);border-radius:6px;padding:3px 6px}
.cb{padding:0 14px 12px}
.cb .vraag{font-weight:700}
details.ans{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
details.ans>summary{cursor:pointer;color:var(--acc);font-weight:700}
details.ans div{margin-top:6px}
.quiz{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.quiz .qq{font-weight:700;margin-bottom:8px}
.quiz .opts{display:grid;gap:6px}
.quiz button.o{text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}
.quiz button.o.good{border-color:var(--ok);background:var(--okbg)}
.quiz button.o.bad{border-color:var(--no);background:var(--nobg)}
.quiz .ex{margin-top:8px;font-size:.92rem;color:var(--ink)}
.quiz .tag{font:800 .66rem var(--fb);letter-spacing:.07em;text-transform:uppercase;color:var(--rk)}
.prog{display:flex;align-items:center;gap:10px;margin:8px 0 0;font-size:.82rem;color:var(--muted)}
.prog i{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden;display:block}
.prog i b{display:block;height:100%;background:var(--rk);width:0}
.cta{display:block;text-align:center;background:var(--rk);color:#fff;border-radius:12px;padding:13px;font:700 1rem var(--fb);text-decoration:none;margin:18px 0 8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cta{color:#0b111f}}
:root[data-theme="dark"] .cta{color:#0b111f}
/* spiek */
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.big div{background:var(--accbg);border-radius:12px;padding:10px;text-align:center;min-width:0}
.big b{display:block;font:700 1.35rem var(--fh);color:var(--acc)}
.big span{font-size:.76rem;color:var(--muted)}
.row{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.tag{font:800 .7rem var(--fb);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.pill{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.8rem;font-weight:700;margin-right:4px}
.pill.y{background:var(--okbg);color:var(--ok)}.pill.n{background:var(--nobg);color:var(--no)}.pill.w{background:var(--warnbg);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{border:2px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:12px;font:700 .85rem var(--fb);cursor:pointer}
.chips button[aria-pressed=true]{border-color:var(--rk);background:var(--accbg)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.chk:first-of-type{border-top:0}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:transparent}
.chk[aria-checked=true] .box{background:var(--ok);border-color:var(--ok);color:#fff}
.chk[aria-checked=true] .t{opacity:.55}
.chk b{display:block}.chk small{color:var(--muted);font-size:.85rem}
.mist{border-left:5px solid var(--no);padding:10px 12px;background:var(--nobg);border-radius:0 10px 10px 0;margin-bottom:10px}
.mist b{display:block;margin-bottom:2px}
.mist .r{color:var(--ok);font-weight:600;margin-top:3px;display:block}
.fl{background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:190px;padding:18px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;text-align:left;width:100%;color:var(--ink);font:inherit}
.fl .q{font-weight:700;font-size:1.05rem}
.fl .a{margin-top:12px;padding-top:12px;border-top:2px dashed var(--line);color:var(--ok);font-weight:600}
.fl .hint{color:var(--muted);font-size:.8rem;margin-top:12px}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.ctl button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:10px;font:600 .9rem var(--fb);cursor:pointer}
.ctl button.go{background:var(--ok);border-color:var(--ok);color:#fff}
.sb{position:relative;margin:8px 0 2px}
.sb input{width:100%;padding:11px 38px 11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px var(--fb)}
.sb button{position:absolute;right:6px;top:6px;border:0;background:transparent;color:var(--muted);font-size:1.2rem;padding:4px 8px;cursor:pointer}
mark{background:var(--warnbg);color:var(--ink);border-radius:3px;padding:0 1px}
.res{border-top:1px solid var(--line);padding:10px 0}
.res:first-child{border-top:0}
.res .sec{font:800 .68rem var(--fb);text-transform:uppercase;letter-spacing:.04em;color:var(--rk)}
.res b{display:block}
a.wl{color:var(--acc);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
/* beslisboom */
.bq{font:700 1.15rem/1.3 var(--fh);margin:4px 0 12px}
.bo{display:grid;gap:8px}
.bo button{text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font:600 1rem var(--fb);cursor:pointer}
.bo button:hover{border-color:var(--rk)}
.bres{border-radius:12px;padding:14px;font-weight:600}
.bres.ok{background:var(--okbg);color:var(--ok)}.bres.no{background:var(--nobg);color:var(--no)}.bres.warn{background:var(--warnbg);color:var(--warn)}
.bres .w{font-weight:500;color:var(--ink);margin-top:6px;display:block}
.trail{font-size:.78rem;color:var(--muted);margin-bottom:8px}
/* hub */
.hero{padding:22px 0 8px}
.hero h1{font-size:2rem}
.route{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
@media (max-width:640px){.route{grid-template-columns:1fr 1fr}}
.route div{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--rk);border-radius:12px;padding:10px 12px;min-width:0}
.route b{display:block;font:700 .95rem var(--fh)}
.route span{font-size:.78rem;color:var(--muted)}
.gr{margin:22px 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.gr h2{font:700 1.2rem var(--fh);margin:0}
.gr span{font-size:.85rem;color:var(--muted)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mod .nr{font:700 .72rem var(--fb);color:var(--rk);letter-spacing:.06em}
.mod h3{font:700 1.08rem var(--fh);margin:0}
.mod p{margin:0;color:var(--muted);font-size:.88rem;flex:1}
.mod .bt{display:flex;gap:8px;margin-top:6px}
.mod .bt a{flex:1;text-align:center;padding:9px 6px;border-radius:10px;border:1.5px solid var(--rk);font:700 .85rem var(--fb);text-decoration:none;color:var(--rk)}
.mod .bt a.fill{background:var(--rk);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mod .bt a.fill{color:#0b111f}}
:root[data-theme="dark"] .mod .bt a.fill{color:#0b111f}
.src{margin-top:26px;font-size:.8rem;color:var(--muted,#6b7280)}
footer.f{margin-top:22px;font-size:.8rem;color:var(--muted)}
#up{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:0;background:var(--rk);color:#fff;font-size:1.4rem;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:pointer;display:none;z-index:9}
#pa{display:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media print{
 body{background:#fff;color:#000;padding:0;font-size:10pt}
 nav.tabs,.sb,.sw,#up,.cta,.crumb,#m,.src{display:none!important}
 #pa{display:block}
 .card{break-inside:avoid;border-color:#999}
 .big{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* snelle onderwerpenlijst op de hub */
.quick{margin:14px 0 6px}
.quick h2{font:700 1.25rem var(--fh);margin:0 0 8px}
.qg{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--rk);border-radius:14px;padding:6px 12px 8px;margin-bottom:10px}
.qh{font:800 .72rem var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--rk);padding:6px 0}
.qrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.qn{flex:none;width:24px;height:24px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font:700 .78rem var(--fb);color:var(--rk)}
.qt{flex:1;min-width:0;font-weight:600;line-height:1.25}
.qrow a{flex:none;padding:8px 11px;border-radius:9px;border:1.5px solid var(--rk);font:700 .82rem var(--fb);text-decoration:none;color:var(--rk)}
.qrow a:first-of-type{background:var(--rk);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .qrow a:first-of-type{color:#0b111f}}
:root[data-theme="dark"] .qrow a:first-of-type{color:#0b111f}

.bo button.weet{border-style:dashed;color:var(--muted);background:transparent}

/* menu bovenin */
.mbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-left,0px)) 0}
.mbar-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 0}
.mbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:700 .9rem var(--fb);cursor:pointer}
.mic{width:16px;height:2px;background:currentColor;box-shadow:0 5px 0 currentColor,0 -5px 0 currentColor;border-radius:2px}
.mhome{font:700 1rem var(--fh);color:var(--ink);text-decoration:none}
.mpanel{max-width:1040px;margin:0 auto;max-height:calc(100vh - 64px);max-height:calc(100dvh - 64px);overflow-y:auto;padding:4px 0 16px;-webkit-overflow-scrolling:touch}
.mpanel[hidden]{display:none}
.mtop{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.mtop a{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:999px;font:600 .85rem var(--fb);text-decoration:none}
.mg{margin:0 0 10px}
.mgh{font:700 .75rem var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--rk);padding:6px 2px}
.md{border:1px solid var(--line);background:var(--card);border-radius:12px;margin:0 0 6px;border-left:4px solid var(--rk)}
.md summary{display:flex;gap:10px;align-items:center;padding:11px 12px;cursor:pointer;font:600 .95rem var(--fb);list-style:none}
.md summary::-webkit-details-marker{display:none}
.md summary::after{content:"+";margin-left:auto;color:var(--muted);font-weight:700}
.md[open] summary::after{content:"\2212"}
.md.cur{box-shadow:0 0 0 2px var(--rk) inset}
.md .qn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--rk);color:#fff;display:inline-flex;align-items:center;justify-content:center;font:700 .75rem var(--fb)}
.ml{display:flex;gap:8px;padding:0 12px 12px 46px}

<script>window.SINGLE=true;window.MODE="hub";window.BOOK={"titel":"Handboek WWM op straat","tag":"Intern document","sub":"Intern naslagwerk voor ons team: de Wet wapens en munitie op straat, in de volgorde van de afhandeling. Veiligstellen, categorie, dragen of voorhanden, digibon of aanhouden, beslag, stappenplan en feitcodes in MEOS.","flat":true};</script>
<script>
window.MENU = [{"id":"m20","nr":1,"reeks":3,"titel":"WWM op straat"}];
(window.MODS = window.MODS || []).push({
  id: "m20", nr: 20, reeks: 3, boek: "wwm",
  titel: "WWM op straat",
  kort: "Wapen aangetroffen: veiligstellen, categorie, dragen of voorhanden, digibon of aanhouden, beslag, stappenplan en feitcodes in MEOS.",
  wetten: [["Wet wapens en munitie", "BWBR0008804"], ["Wetboek van Strafvordering", "BWBR0001903"]],
  intro: "Je treft een wapen aan. Dit boekje volgt de volgorde waarin je het op straat afhandelt: eerst veilig, dan wat is het, dragen of voorhanden, digibon of aanhouden, beslag, het stappenplan en de feitcodes in MEOS. Het is getoetst aan de WWM, het Wetboek van Strafvordering, de OM-richtlijn wapens en munitie (2016R017), de Beslagwijzer WWM en de OM-Boetebase. Wat een interne werkafspraak is en geen wet, staat er telkens bij.",
  doelen: ["een aangetroffen wapen veilig stellen en de categorie bepalen", "dragen en voorhanden hebben onderscheiden en de juiste feitcode kiezen", "beslissen: digibon of aanhouden", "de beslagtoets toepassen en het stappenplan op straat uitvoeren", "het juiste dossier maken bij zwaardere wapens"],
  leren: [
    { h: "1. Eerst veilig: wat heb je aangetroffen?", b: [
      ["p", "Veiligheid gaat voor de juridische indeling. Behandel elk wapen dat je aantreft alsof het echt en geladen is, ook als het nep lijkt."],
      ["ol", ["Behandel elk vuurwapen als geladen.", "Richt nooit op iets dat je niet wilt raken.", "Houd je vinger buiten de trekkerbeugel tot je klaar bent om te schieten.", "Wees zeker van je doelwit en wat erachter ligt."]],
      ["tab", ["Je treft aan", "Wat je doet"], [
        ["Vuurwapen, munitie of een belangrijk onderdeel (magazijn, loop, frame, patroon, geluiddemper, samengesteld of 3D-geprint onderdeel)", "Eerst veilig maken. Voorlopig de categorie bepalen. Raak, ontlaad of demonteer alleen als je daarvoor bent opgeleid en bevoegd. Bescherm waar mogelijk DNA, vingersporen en de aangetroffen toestand. Een onderdeel kan zelf al een wapen zijn."],
        ["Mes, luchtdruk-, airsoft- of nepwapen", "Kleur of verkoopnaam bepaalt de categorie niet. Leg vast: vorm, maat, bouw, werking, gebruik en omstandigheden. Maak foto’s van het voorwerp en de omgeving voordat je het verplaatst."],
        ["Gewoon voorwerp dat als wapen is gebruikt", "Een voorwerp kan onder categorie IV vallen als uit de aard of de omstandigheden redelijkerwijs kan worden aangenomen dat het bestemd is om letsel toe te brengen of te dreigen (WWM 2, categorie IV onder 7°). Noteer hoe het gedragen of gebruikt werd en waarvoor het bestemd was."],
        ["Explosief, zelfgemaakt of instabiel voorwerp", "Niet zelf onderzoeken of vervoeren. Houd afstand, zet het gebied af en schakel de specialistische eenheid in. Niet aanraken, ontladen of demonteren."]
      ]],
      ["stap", [
        ["Wapen veiligstellen", "Alleen als je daarvoor getraind bent: ontladen, magazijn los, patroonkamer controleren. Anders laat je het aan een specialist."],
        ["Eerst vastleggen", "Maak vóór verplaatsing foto’s van ligging, omgeving, bereikbaarheid en zichtbare munitie. Leg positie, serienummer, merk, kaliber en toestand vast."],
        ["Forensisch", "Stem eerst af met forensische opsporing voordat je afveegt, ontlaadt, uit elkaar haalt of test."]
      ]],
      ["quiz", "Je ziet een pistool in een rugzak. Het lijkt een nepwapen. Wat doe je eerst?", ["Het oppakken om te kijken", "Behandelen als een echt wapen en veilig stellen", "Het teruggeven aan de eigenaar", "Alleen een foto maken"], 1, "Veiligheid eerst: behandel elk wapen als echt en geladen. Daarna pas onderzoeken of het nep is."]
    ] },
    { h: "2. Welke categorie? De vijf vragen", b: [
      ["p", "De Wet wapens en munitie (WWM) is een verbodswet met uitzonderingen. Bij elk wapen stel je dezelfde vijf vragen."],
      ["stap", [
        ["1. Is het een wapen in de zin van de wet?", "Een voorwerp dat in WWM 2 genoemd of krachtens dat artikel aangewezen is. Ook een voorwerp dat door zijn aard of door de omstandigheden redelijkerwijs bestemd lijkt om letsel toe te brengen, kan onder categorie IV vallen."],
        ["2. In welke categorie valt het?", "Categorie I t/m IV bepaalt welke verboden gelden. Zie de tabel hieronder."],
        ["3. Is er verlof of vrijstelling?", "Voor categorie II en III is voorhanden hebben verboden, tenzij je houder bent van een verlof (voor zover het reikt) of een omgevingsvergunning voor een jachtgeweeractiviteit hebt (WWM 26 lid 2). Voor personen onder 18 is voorhanden hebben van een wapen van categorie IV verboden (WWM 26 lid 5). Controleer identiteit en leeftijd, en of persoon, voorwerp, nummer, hoeveelheid, doel en voorwaarden kloppen."],
        ["4. Wordt het gedragen of vervoerd?", "Dragen van categorie II, III en IV is verboden (WWM 27 lid 1), behalve met een verlof (voor zover het reikt) of op grond van WWM 26 lid 2 voor jacht, beheer en schadebestrijding (WWM 27 lid 2). Categorie I is helemaal verboden (WWM 13)."],
        ["5. Welke bevoegdheid gebruik ik?", "WWM 50 t/m 52, plus de gewone regels uit het Wetboek van Strafvordering."]
      ]],
      ["truc", "Onthoud de vijf met één zin: <b>Wapen? Categorie? Verlof? Dragen? Bevoegdheid?</b>"],
      ["tab", ["Categorie", "Wat valt eronder (selectie)", "Hoofdregel"], [
        ["I", "Stiletto’s, valmessen en vlindermessen; opvouwbare messen met meer dan één snijkant of langer dan 28 cm opengevouwen; boksbeugels, ploertendoders, wurgstokken, werpsterren, vilmessen, ballistische messen, geluiddempers voor vuurwapens; blanke wapens die op een ander voorwerp lijken; pijlen en pijlpunten met snijdende delen bedoeld voor ernstig letsel; katapulten; door de minister aangewezen voorwerpen", "Vervaardigen, voorhanden hebben, dragen en vervoeren is verboden (WWM 13)"],
        ["II", "Vuurwapens die niet onder een andere categorie vallen; automatische vuurwapens; moeilijk zichtbare of aangepaste vuurwapens; stroomstootwapens; voorwerpen bestemd voor het treffen van personen met giftige, verstikkende, weerloosmakende of traanverwekkende stoffen; voorwerpen bestemd voor het treffen met vuur of ontploffing", "Voorhanden hebben is verboden zonder verlof (WWM 26). Dragen is verboden (WWM 27)"],
        ["III", "Vuurwapens in de vorm van geweren, revolvers en pistolen (voor zover niet categorie II); toestellen voor beroepsdoeleinden die projectielen kunnen afschieten; werpmessen; alarm- en startpistolen en -revolvers (met uitzonderingen)", "Zoals categorie II"],
        ["IV", "Blanke wapens met meer dan één snijkant (die niet onder I vallen); degens, zwaarden, sabels en bajonetten; wapenstokken; lucht-, gas- en veerdrukwapens; kruisbogen en harpoenen; voorwerpen waarvan door hun aard of de omstandigheden waaronder ze worden aangetroffen redelijkerwijs kan worden aangenomen dat ze bestemd zijn om letsel toe te brengen of te dreigen", "Dragen is verboden (WWM 27), behalve met verlof of vrijstelling"]
      ]],
      ["let", "Lucht-, gas- en veerdrukwapens zijn categorie IV (WWM 2, categorie IV 4°). Uitgezonderd zijn de wapens die de minister op grond van categorie I 7° heeft aangewezen omdat ze zo op een vuurwapen lijken dat ze voor bedreiging of afdreiging geschikt zijn: die zijn categorie I."],
      ["tip", "Een gebruikt keukenmes is niet automatisch een WWM-feit. Beoordeel categorie IV en het dragen apart. Ook zonder WWM-feit kan het mes bewijs zijn en daarom onder Sv 94 vallen."],
      ["quiz", "Iemand draagt op straat een vlindermes. Welke categorie en welke regel?", ["Categorie IV, dragen is verboden (WWM 27)", "Categorie I, verboden (WWM 13)", "Categorie III, verlof nodig", "Geen wapen"], 1, "Vlindermessen zijn categorie I. Voor die categorie is vervaardigen, voorhanden hebben, dragen en vervoeren verboden (WWM 13)."],
      ["casus", "Casus: het mes in de broekzak", "Je controleert een 17-jarige op straat na een melding over een ruzie. In zijn zak zit een vouwmes met een lemmet van 8 cm en één snijkant. Hij zegt: ‘Voor mijn werk bij de bouw.’", "Is dit een wapen?", "Een gewoon vouwmes met één snijkant en een kort lemmet valt niet vanzelf onder categorie I (meer dan één snijkant of langer dan 28 cm opengevouwen). Het kan wel categorie IV zijn als door de aard of de omstandigheden redelijkerwijs kan worden aangenomen dat het bestemd is om letsel toe te brengen (WWM 2). Kijk dus naar de omstandigheden: de melding over een ruzie, wat hij zei, hoe hij het bij zich had, of zijn verhaal klopt. Leg vast wat je zag en waarom je het wel of niet als wapen beoordeelde. Is het een vlindermes of stiletto, dan is het categorie I. Is het wel categorie IV, dan is voorhanden hebben door iemand onder 18 jaar verboden (WWM 26 lid 5)."]
    ] },
    { h: "3. Dragen of voorhanden?", b: [
      ["p", "Het onderscheid bepaalt de feitcode. Volgens de presentatie, simpel gezegd:"],
      ["tab", ["", "Wat het is", "Voorbeelden"], [
        ["<b>Dragen</b>", "Op het lichaam, in de handen of direct binnen handbereik en klaar voor gebruik.", "In de handen, in de broeksband, onder een autostoel, in het deurportier, in de middenconsole of het handschoenkastje."],
        ["<b>Voorhanden hebben</b>", "Weten dat iets in de nabijheid is en er makkelijk over kunnen beschikken, maar daar moeite voor moeten doen om het te pakken.", "In een kofferbak, verpakt in een tas of in een kluis."]
      ]],
      ["p", "De MEOS-instructie noemt dit het ‘subtiele verschil’. <b>Dragen</b>: het direct op het lichaam dragen en/of het direct onder handbereik en voor gebruik gereed hebben van een wapen, bijvoorbeeld in het portiervakje, de middenconsole, onder de (bestuurders)stoel of in de beenruimte van de bijrijdersstoel. <b>Voorhanden hebben</b>: het wapen of voorwerp in de nabijheid hebben, maar niet voor direct gebruik gereed, bijvoorbeeld in de kofferbak of in een tas op de achterbank."],
      ["p", "Dragen is G411a (categorie I) of E900 (gelegenheidswapen), voorhanden hebben is G411b of G412. WWM 13 verbiedt voor categorie I zowel het dragen als het voorhanden hebben. Voor de categorieën II, III en IV staan het voorhanden hebben (WWM 26) en het dragen (WWM 27) in aparte artikelen."],
      ["quiz", "Een stiletto zit in de broeksband van een meerderjarige. Welke feitcode?", ["G411b", "G411a", "G412", "E900"], 1, "Een stiletto is categorie I. In de broeksband is dragen: op het lichaam en klaar voor gebruik. Dat is G411a."],
      ["quiz", "Dezelfde stiletto ligt in de kofferbak, in een tas. Welke feitcode?", ["G411a", "G411b", "E900", "G412"], 1, "In een kofferbak, verpakt in een tas, kost het moeite om het te pakken. Dat is voorhanden hebben: G411b."],
      ["quiz", "Een honkbalknuppel ligt in de kofferbak. Is dat E900?", ["Ja, altijd", "Nee, E900 gaat over dragen", "Ja, als het een gelegenheidswapen is", "Alleen bij een minderjarige"], 1, "E900 is het dragen van een gelegenheidswapen. In de kofferbak is het voorhanden hebben, niet dragen."]
    ] },
    { h: "4. Wat zegt de wet?", b: [
      ["p", "Eerst de bronnen: de WWM, het Wetboek van Strafvordering en de Richtlijn voor strafvordering wapens en munitie (2016R017)."],
      ["tab", ["Feit", "Artikel", "Straf"], [
        ["Categorie I voorhanden hebben of dragen", "WWM 13, WWM 55 lid 1", "Misdrijf: gevangenisstraf tot 9 maanden of geldboete vierde categorie (WWM 56). Geen VH-feit."],
        ["Categorie II of III voorhanden zonder verlof", "WWM 26, WWM 55 lid 1", "Gevangenisstraf tot 9 maanden of geldboete vierde categorie. Dit geldt onder meer voor categorie II onder 6° (zoals pepperspray)."],
        ["Categorie II (behalve 2° en 7°) of een vuurwapen categorie III voorhanden zonder verlof", "WWM 26, WWM 55 lid 3 onder a", "Gevangenisstraf tot 8 jaar of geldboete vijfde categorie"],
        ["Categorie II onder 2° (automatische vuurwapens) of 7° (voorwerpen voor vuur of ontploffing) voorhanden zonder verlof", "WWM 26, WWM 55 lid 7", "Gevangenisstraf tot 8 jaar of geldboete vijfde categorie"],
        ["Van het in strijd met de wet vervaardigen, overdragen, verhandelen of herstellen van wapens een beroep of gewoonte maken", "WWM 55 lid 4", "Gevangenisstraf tot 8 jaar of geldboete vijfde categorie"],
        ["Categorie II, III of IV dragen", "WWM 27 lid 1, WWM 54", "Overtreding: geldboete derde categorie (WWM 56)"],
        ["Categorie IV voorhanden hebben onder 18 jaar, of overdragen aan iemand onder 18 jaar", "WWM 26 lid 5, WWM 31 lid 4, WWM 54", "Overtreding: geldboete derde categorie (WWM 56). Volgens de OM-richtlijn kan dit alleen met een geldboete worden bestraft."]
      ]],
      ["let", "Dragen van een wapen van categorie II, III of IV (WWM 27 lid 1) is op zichzelf een overtreding. Heeft de drager een wapen van categorie II of III ook voorhanden zonder verlof, dan geldt ook WWM 26 met WWM 55."],
      ["p", "<b>Aanhouden en voorlopige hechtenis</b>"],
      ["ul", ["Aanhouden is een bevoegdheid, geen plicht. Op heterdaad is ieder bevoegd de verdachte aan te houden (Sv 53 lid 1). Buiten heterdaad kan de opsporingsambtenaar dat op bevel van de officier van justitie bij een misdrijf waarvoor voorlopige hechtenis is toegelaten (Sv 54 lid 1).", "Voorlopige hechtenis is toegelaten bij een misdrijf met een maximumstraf van vier jaar of meer (Sv 67 lid 1 onder a). Dat is het geval bij een vuurwapen van categorie II of III (acht jaar). Bij de misdrijven van WWM 55 lid 1 (negen maanden) is dat niet zo.", "Staande houden en identiteit vaststellen bij verdenking: Sv 52.", "De OM-richtlijn zegt: verdachte in beginsel voorgeleiden bij vuurwapen(s)."]],
      ["p", "<b>Bevoegdheden bij een wapen (WWM 50 t/m 52)</b>. Als daartoe redelijkerwijs aanleiding bestaat, hebben opsporingsambtenaren aanvullende bevoegdheden. De aanleiding is: een gepleegd strafbaar feit waarbij wapens zijn gebruikt, een overtreding van WWM 13, 26 of 27, of aanwijzingen dat zo’n feit zal worden gepleegd."],
      ["dl", [
        ["WWM 50", "Vorderen dat de verpakking van goederen, met inbegrip van reisbagage, wordt geopend."],
        ["WWM 51", "Vervoermiddelen onderzoeken."],
        ["WWM 52", "Altijd inbeslagnemen van voor beslag vatbare voorwerpen (lid 1), en personen aan de kleding onderzoeken bij aanleiding (lid 2)."],
        ["Ten opzichte van een ieder", "De bevoegdheid geldt in beginsel tegen bepaalde personen of vervoermiddelen waarvoor aanleiding bestaat. De officier van justitie kan gelasten dat ze tegenover een ieder wordt uitgeoefend (WWM 50 lid 2, 51 lid 2). In een veiligheidsrisicogebied (Gemw 151b lid 1 of 174b lid 1) kan hij gelasten dat tegenover een ieder wordt gecontroleerd op wapens of munitie. Het bevel geldt ten hoogste twaalf uur, vermeldt het gebied en de feiten en omstandigheden, en wordt schriftelijk gegeven (zo nodig achteraf op schrift gesteld) (WWM 50 lid 3 en 5, 51 lid 3 en 5, 52 lid 3 en 4)."]
      ]],
      ["p", "Verlof: de verboden van WWM 26 en 27 gelden niet voor houders van een verlof, voor zover het reikt (WWM 26 lid 2, WWM 27 lid 2). Binnentreden voor een wapendoorzoeking vraagt een eigen grondslag en machtiging."],
      ["p", "<b>OM-beleid.</b> De Richtlijn voor strafvordering wapens en munitie (2016R017, in werking sinds 1 januari 2017) geldt voor de meest voorkomende misdrijven en enkele overtredingen met wapens en munitie: WWM 13, 26, 27, 31, 54 en 55. Zij is niet van toepassing op grootschalige in- en uitvoer en handel, dat vraagt maatwerk. De richtlijn gaat uit van een basiscasus (een categorie I-wapen voorhanden hebben, dragen of overdragen, alleen gepleegd) en noemt bij wapens ook de onttrekking aan het verkeer."]
    ] },
    { h: "5. Digibon of aanhouden?", b: [
      ["p", "Wat de wet geeft is een bevoegdheid om aan te houden. Wat hieronder staat is de <b>interne werkafspraak</b> uit de presentatie De Wet wapens en munitie op straat, en geen wettelijke plicht. Een digibon met WWM-feitcode is bedoeld voor zaken die aan alle vier de voorwaarden voldoen:"],
      ["ol", ["Het gaat om een van de <b>genoemde wapens</b>, per feitcode (E900, G411a, G411b, G412).", "Er is <b>geen arrestant</b>: je neemt niemand mee naar het bureau.", "De verdachte is <b>meerderjarig</b>.", "De zaak is <b>op straat af te handelen</b>."]],
      ["p", "Voldoet de zaak niet aan alle vier, dan is volgens de werkafspraak <b>aanhouden</b> de route. Dat geldt bij een minderjarige verdachte, bij niet-genoemde wapens, en bij een ander feit dan alleen het dragen of voorhanden hebben van een wapen."],
      ["tab", ["Situatie", "Volgens de werkafspraak"], [
        ["Meerderjarige, genoemd wapen, alleen dragen of voorhanden hebben, op straat af te handelen", "Maak in MEOS een digibon op met de WWM-feitcode (zie hoofdstuk 7)."],
        ["Minderjarige verdachte", "Aanhouden."],
        ["Een wapen dat niet bij een feitcode genoemd wordt", "Aanhouden."],
        ["Een ander feit dan alleen dragen of voorhanden hebben", "Aanhouden."],
        ["Vuurwapen van categorie II of III zonder verlof", "Geen digibon: volledig proces-verbaal en dossier (zie hoofdstuk 8)."]
      ]],
      ["let", "Ook bij een digibon blijft gelden dat beslag en afdoening twee losse beslissingen zijn (hoofdstuk 6) en dat het OM de sanctie bepaalt."]
    ] },
    { h: "6. Beslag", b: [
      ["p", "Bepaal de reden en de bevoegdheid apart. Drie vragen, in deze volgorde:"],
      ["stap", [
        ["1. Waarom moet het mee?", "Sv 94: voorwerpen zijn vatbaar voor inbeslagneming als ze kunnen dienen om de waarheid aan de dag te brengen of om wederrechtelijk verkregen voordeel aan te tonen (lid 1), of als verbeurdverklaring of onttrekking aan het verkeer kan worden bevolen (lid 2)."],
        ["2. Mag jij het meenemen?", "WWM 52 lid 1: opsporingsambtenaren zijn te allen tijde bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen en kunnen hun uitlevering vorderen."],
        ["3. Moet je daarvoor zoeken?", "WWM 52 lid 1 geeft geen recht op fouilleren, binnentreden of doorzoeken. Daarvoor heb je een eigen bevoegdheid nodig: WWM 50 t/m 52 of een bepaling uit het Wetboek van Strafvordering."]
      ]],
      ["tab", ["Antwoord", "Wat je doet"], [
        ["Een of meer keer “nee”", "Geen grond. Leg geen beslag. Kijk of afhandeling zonder beslag mogelijk is."],
        ["Een of meer keer “weet ik niet”", "Pauzeer en overleg met de hulpofficier van justitie of de officier van justitie voordat je iets meeneemt. Maak intussen de situatie veilig en leg vast wat je zag."],
        ["Alles “ja” (bij vraag 3 ook “ik hoef niet te zoeken”)", "Stel het voorwerp veilig, leg het vast en maak een kennisgeving van inbeslagneming (KVI) en een bewijs van ontvangst. Leg het beslag direct voor aan de hulpofficier of officier van justitie (Sv 94 lid 3, Sv 116 lid 1). Maak ook een proces-verbaal of maak in MEOS een digibon op."]
      ]],
      ["let", "De OM-richtlijn noemt vaak onttrekking aan het verkeer. Zij gaat over de strafeis en geeft geen eigen bevoegdheid om te fouilleren, te zoeken of beslag te leggen."],
      ["quiz", "Je mag in beslag nemen volgens WWM 52 lid 1. Mag je daarom ook de tas en de woning doorzoeken?", ["Ja, beslag omvat zoeken", "Nee, zoeken vraagt een eigen bevoegdheid", "Alleen de tas", "Alleen met toestemming van de eigenaar"], 1, "WWM 52 lid 1 gaat over inbeslagneming en vordering van uitlevering. Fouilleren, binnentreden en doorzoeken vragen een eigen bevoegdheid (WWM 50 t/m 52 of Sv)."],
      ["p", "<b>Beslag is geen afdoening.</b> Een wapen in beslag nemen en geen proces-verbaal maken, komt voor, maar mag niet. De wapenmisdrijven uit WWM 55 zijn misdrijven (WWM 56). Sv 152 lid 1 verplicht tot een proces-verbaal. Alleen onder verantwoordelijkheid van het OM mag dat achterwege blijven (Sv 152 lid 2). Afzien van vervolging kan alleen het OM (Sv 167 lid 2)."],
      ["ul", ["<b>Volwassene</b>: de politie kan niet zelf waarschuwen of seponeren. Een politiewaarschuwing is geen afdoening bij een wapenmisdrijf.", "<b>Jeugdige first offender</b>: de bevoegde opsporingsambtenaar kan bij een overtreding of een licht misdrijf een reprimande geven. Bij andere misdrijven alleen met toestemming van de officier van justitie. Halt kan alleen voor feiten uit het Besluit aanwijzing Halt-feiten 2024; volgens de Beslagwijzer staan wapens daar niet in (Aanwijzing Jeugdstrafrecht 2026A002).", "<b>Beslag en afdoening</b> zijn twee losse beslissingen. Ook bij een jeugdafdoening of een sepot blijft het voorwerp in de beslagketen. De officier van justitie beslist later over teruggave of vernietiging.", "<b>Legaal bezit zonder verdenking</b>: wie zonder gerechtigd te zijn een wapen of munitie voorhanden heeft, moet die terstond bij de korpschef in bewaring geven (WWM 8). Dat is bestuurlijk en geen strafrechtelijke afdoening. Bij legaal bezit kan een zorgsignaal nodig zijn, bijvoorbeeld naar Bureau Korpscheftaken."]],
      ["p", "<b>Wapen in een voertuig.</b> Voorwerp en voertuig zijn twee aparte beslagbeslissingen. Een wapen of munitie binnen handbereik kan strafverzwarend zijn. Dat is nog geen reden om het voertuig in beslag te nemen."],
      ["stap", [
        ["Leg vast bij de vondst", "Waar lag het? Was het zichtbaar en bereikbaar? Hoe was het verpakt? Wie had sleutel of toegang? Waar zaten de inzittenden? Wie waren bestuurder, inzittenden, kentekenhouder en eigenaar? Kentekenregistratie alleen bewijst geen voorhanden hebben."],
        ["Toets: het hele voertuig mee?", "Heeft het voertuig zelf een beslagreden? Is het echt nodig en staat het in verhouding? Ben je bevoegd om het in beslag te nemen? Is alleen het wapen nodig, dan laat je het voertuig in beginsel achter."]
      ]],
      ["p", "<b>Kort beslag</b> volgt dezelfde regels. “Even meenemen” bestaat niet: ook voor een paar uur gelden reden, bevoegdheid, verhouding, KVI, bewijs van ontvangst en directe toetsing door de hulpofficier of officier van justitie. Zij beslissen over het voortduren van het beslag en geven het voorwerp onverwijld terug als het belang van de strafvordering is vervallen (Sv 116 lid 1)."],
      ["p", "<b>Vrijwillige afgifte zonder beslag</b> is iets anders dan afstand na beslag. Sv 116 lid 2 gaat over schriftelijke afstand van een al inbeslaggenomen voorwerp. Zonder beslag maak je geen KVI alsof er beslag was. Leg de vrijwillige overdracht apart vast: welk goed, van wie, dat de afgifte vrijwillig is, datum en tijd, bestemming en handtekeningen."],
      ["ul", ["Afstand na beslag moet schriftelijk, met een aparte verklaring of een ondertekend verhoor. Noem ieder voorwerp precies.", "Afstand vervangt de grondslag voor beslag niet.", "Laat niet zomaar tekenen bij minderjarigheid, taalproblemen, druk, ruzie over eigendom of als iemand de gevolgen niet kan overzien.", "Jonger dan 12 jaar: alleen de wettelijke vertegenwoordiger kan schriftelijk afstand doen (OM Instructie inbeslagneming 2024I001)."]],
      ["casus", "Casus: het wapen onder de stoel", "Bij een verkeerscontrole zie je onder de bestuurdersstoel een pistool. De bestuurder zegt dat het van zijn broer is, de eigenaar van de auto.", "Wat neem je mee?", "Twee beslissingen. Het pistool: je hebt een beslagreden (Sv 94) en bevoegdheid (WWM 52 lid 1); het zoeken in het voertuig vraagt een eigen bevoegdheid (WWM 51). Het voertuig: alleen met een eigen reden, noodzaak en verhouding; is alleen het wapen nodig, dan laat je het voertuig achter. Leg vast waar het lag, of het bereikbaar was, wie sleutel en toegang had en wie wat zei. Maak een KVI en ontvangstbewijs, leg het beslag voor aan de hulpofficier en maak een proces-verbaal. Een pistool is een vuurwapen: zie hoofdstuk 8."]
    ] },
    { h: "7. Op straat: stappenplan, KVI en feitcodes", b: [
      ["p", "Het stappenplan uit de MEOS-instructie voor een digibon, in volgorde:"],
      ["stap", [
        ["1. Digibon", "Maak op straat in MEOS een digibon met WWM-feitcode op."],
        ["2. Afstandsverklaring", "Maak de afstandsverklaring op straat op en laat die tekenen, digitaal of ‘nat’."],
        ["3. Foto’s", "Maak een foto van het wapen en van de afstandsverklaring in de digibon-app (dat voeg je het makkelijkst toe)."],
        ["4. Redenen van wetenschap", "Omschrijf hoe en waar je het wapen hebt aangetroffen. Dat is nodig voor het onderscheid dragen of voorhanden."],
        ["5. Beslagindicator", "Vink in de digibon de beslagindicator aan."],
        ["6. PDB op nabewerken", "Zet de digibon op NABEWERKEN bij het versturen vanuit de digibon-app."],
        ["7. Mutatie in BVH", "Maak een mutatie op in BVH. Je kunt de tekst van de verklaring in PDB kopiëren en plakken."],
        ["8. KVI opmaken", "Maak de KVI op en print er twee."],
        ["9. KVI scannen", "Scan de KVI, of maak een foto in de digibon-app, voor in PDB. Eén KVI gaat bij het goed (aan de zak of koker), één KVI in het dossier."],
        ["10. Goed deponeren", "Plaats het goed of wapen in een open zak of koker en deponeer het."],
        ["11. BVH-nummer mailen", "Mail het BVH-nummer naar de WWM-taakaccenthouder."],
        ["12. Verbaal en foto’s", "Voeg het WWM-verbaal en de fotobijlage toe aan de digibon of PDB."],
        ["13. Bon verzenden", "Verzend de bon naar het CVOM."]
      ]],
      ["p", "<b>Totaal bijvoegen in PDB:</b>"],
      ["ol", ["De KVI.", "De afstandsverklaring.", "Het WWM-beschrijvingsverbaal van het wapen en de fotobijlage. Bij feitcode E900 volstaat een beschrijving in een proces-verbaal (van bevindingen) en een foto."]],
      ["p", "<b>KVI: wat moet erin?</b> Maak voor iedere beslagene een aparte KVI, zo snel mogelijk in het primaire systeem (OM Instructie inbeslagneming 2024I001):"],
      ["ol", ["Datum van inbeslagneming.", "Per voorwerp een duidelijke omschrijving en een uniek nummer. Noteer aantal en/of gewicht.", "Bij geld: het bedrag in euro’s.", "Grond voor het beslag en kort wat de aanleiding was.", "Naam en persoonsgegevens van de beslagene.", "Naam van de eigenaar of andere rechthebbende, als die bekend is.", "Per voorwerp: wel of geen afstand. Bij afstand ook vastleggen of het voorwerp van de beslagene is.", "Zitten meerdere voorwerpen in één verpakking? Benoem ook de losse onderdelen."]],
      ["p", "Werk de KVI bij als de rechthebbende bekend wordt, alsnog afstand wordt gedaan, een partij wordt gesplitst of de hulpofficier of officier van justitie een beslissing neemt. Zet op het bewijs van ontvangst in elk geval: zaaknummer, datum, beslagene, een herkenbare lijst van de goederen met nummers of aantallen en een contactpunt van de opsporingsinstantie."],
      ["tip", "Wordt een persoon later in BVI-IB gecontroleerd, dan zie je bij BLUESPOT onder Politie Digibonnen Overzicht of die persoon eerder een digibon voor een wapenfeit heeft gekregen."],
      ["casus", "Casus: het mes in de middenconsole", "Bij een controle ligt in de middenconsole van een auto een vlindermes. De bestuurder is 34 jaar en zegt dat het van zijn werk is. Er is geen ander feit.", "Digibon of aanhouden?", "Een vlindermes is categorie I. In de middenconsole is het direct binnen handbereik en klaar voor gebruik: dragen, dus G411a. De verdachte is meerderjarig, het is een genoemd wapen, er is geen ander feit en je neemt geen arrestant mee: een MEOS-digibon met G411a is mogelijk. Laat de afstandsverklaring tekenen, leg in de reden van wetenschap vast hoe en waar het lag, en zet de bon op nabewerken. Was de bestuurder 17 geweest, dan is volgens de werkafspraak aanhouden de route."],
      ["p", "<b>De feitcodes.</b> Zoek in MEOS bij “Zoek feit” op “wapen”. Je vindt vier feiten: E900, G411a, G411b en G412. Alle vier hebben feitcategorie 8: een ieder."],
      ["tab", ["Code", "Feit", "Grondslag", "Boetebase"], [
        ["E900", "Dragen van een wapen in de zin van categorie IV onder 7° (gelegenheidswapen). Overtreding.", "WWM 2, 27 lid 1, 54", "€ 225"],
        ["G411a", "Dragen van een wapen uit categorie I onder 1° en 3°. Misdrijf.", "WWM 13, 55 lid 1", "€ 325"],
        ["G411b", "Voorhanden hebben van een wapen uit categorie I onder 1° en 3°. Misdrijf.", "WWM 13, 55 lid 1", "€ 225"],
        ["G412", "Voorhanden hebben van een wapen uit categorie II onder 6°: traangaswapen, pepperspray, CS-gas en elke andere stof die weerloos of machteloos maakt. Misdrijf.", "WWM 26, 55 lid 1", "€ 350"]
      ]],
      ["dl", [
        ["E900", "Een voorwerp, zijnde een wapen in de zin van artikel 2 lid 1 categorie IV onder 7 van de WWM, dragen. Leg vast: welk voorwerp, de aard en omstandigheden van het aantreffen, geen ander doel dan letsel aan personen, dreigen. ‘Wapen bij gelegenheid’: denk aan honkbalknuppel, hockeystick, trapleuning, hooivork, koekenpan, baksteen, haarlak, schilmesje, schroevendraaier, keukenmes."],
        ["G411a en G411b", "Een voorwerp, zijnde een wapen in de zin van artikel 2 lid 1 categorie I onder 1 en 3 van de WWM: a dragen, b voorhanden hebben."],
        ["G412", "Een voorwerp, zijnde een wapen in de zin van artikel 2 lid 1 categorie II onder 6 van de WWM (bijvoorbeeld pepperspray en traangas), voorhanden hebben."]
      ]],
      ["ul", ["Bij <b>G411a, G411b en G412</b> dient altijd een rapport aangaande het wapen te worden bijgevoegd.", "Bij <b>E900</b> is een wapenrapport niet noodzakelijk. Een beschrijving in een proces-verbaal (van bevindingen) en een foto is voldoende.", "Is de verdachte minderjarig, dan kunnen deze feiten niet worden afgedaan middels een digibon.", "Uit het proces-verbaal moet blijken waarom het voorwerp op dat moment goed als wapen kon worden gezien.", "Bij categorie I wapens wordt het proces-verbaal opgemaakt door een taakaccenthouder, c.q. de vraagbaak van het BT."]],
      ["p", "<b>Categorie I volgens de presentatie</b> (G411a en G411b): stiletto, valmes, vlindermes (onder 1°); boksbeugel, ploertendoder, wurgstok, werpster, vilmes, ballistisch mes (onder 3°); messen met meer dan één snijkant en of opengevouwen langer dan 28 cm (onder 2°); wapens vermomd als andere voorwerpen, de ‘blanke’ wapens (onder 4°); nep(vuur)wapens, geschikt voor be- en afdreiging (onder 7°). In MEOS staat bij G411a en G411b de omschrijving ‘categorie I onder 1 en 3’ (met geluiddemper); de presentatie noemt daarnaast ook de messen met meer dan één snijkant, de vermomde wapens en de nepwapens."],
      ["p", "<b>Categorie I volgens de instructie</b> (de volledige tekst van WWM 2):"],
      ["ol", ["stiletto’s, valmessen en vlindermessen;", "andere opvouwbare messen, indien het lemmet meer dan een snijkant heeft, of de lengte in opengevouwen toestand langer dan 28 cm is;", "boksbeugels, ploertendoders, wurgstokken, werpsterren, vilmessen, ballistische messen en geluiddempers voor vuurwapens;", "blanke wapens die uiterlijk gelijken op een ander voorwerp dan een wapen;", "pijlen en pijlpunten bestemd om door middel van een boog te worden afgeschoten, die zijn voorzien van snijdende delen met de kennelijke bedoeling daarmee ernstig letsel te kunnen veroorzaken;", "katapulten;", "andere door de minister aangewezen voorwerpen die een ernstige bedreiging van personen kunnen vormen of die zodanig op een wapen gelijken, dat zij voor bedreiging of afdreiging geschikt zijn."]],
      ["p", "<b>Wat maak je op, en wie doet wat?</b> Maak in MEOS een digibon op met de WWM-feitcode. De politie legt voor deze feiten zelf geen sanctie op. Het OM bepaalt het tarief en of het een strafbeschikking of een dagvaarding wordt."],
      ["dl", [
        ["MEOS", "Mobiel Effectiever Op Straat: de smartphone-app van de politie."],
        ["Digibon", "Een bon die je in MEOS aanmaakt om een feit op straat vast te leggen of af te doen."],
        ["Strafbeschikking", "Een straf die zonder rechter wordt opgelegd, voor veelvoorkomende strafbare feiten. Het OM kan die opleggen bij een overtreding of een misdrijf met een maximumstraf van niet meer dan zes jaar (Sv 257a), niet met gevangenisstraf. Aangewezen opsporingsambtenaren kunnen een politiestrafbeschikking met een geldboete opleggen voor aangewezen feiten (Sv 257b)."]
      ]],
      ["let", "De Boetebase zegt zelf: de bedragen worden door de politie of het OM in eerste instantie opgelegd, het CJIB brengt daarnaast administratiekosten in rekening, en in bijzondere gevallen gelden andere boetebedragen en straffen. Zoek op de volledige feitcode (bijvoorbeeld G411a); ‘G411’ levert geen resultaat. De bedragen komen overeen met de OM-richtlijn wapens en munitie (2016R017): € 225 voor een categorie IV-wapen, € 350 voor pepperspray en traangas (categorie II onder 6)."]
    ] },
    { h: "8. Zwaardere wapens: aanhouden en dossier", b: [
      ["p", "Een digibon is niet voor alles. Bij een vuurwapen van categorie II of III zonder verlof is er geen digibon: de maximumstraf is acht jaar (WWM 55 lid 3), dus een strafbeschikking is niet mogelijk (die kan alleen bij een maximumstraf van niet meer dan zes jaar, Sv 257a lid 1). Voorlopige hechtenis is wel toegelaten (Sv 67 lid 1 onder a)."],
      ["tab", ["Wat je aantreft", "Wat jij maakt", "Wat daarna gebeurt"], [
        ["Categorie IV dragen (E900), meerderjarig", "Digibon in MEOS (hoofdstuk 7).", "Het OM beslist over de afdoening. Volwassenen: geen reprimande of waarschuwing als afdoening. Een jeugdige first offender kan een reprimande krijgen: overleg met de officier van justitie of dat hier past."],
        ["Categorie I of categorie II onder 6° (G411a, G411b, G412), meerderjarig", "Digibon in MEOS met de feitcode.", "De officier van justitie bepaalt het tarief en of het een strafbeschikking of een dagvaarding wordt."],
        ["Vuurwapen categorie II of III, explosieven", "Een volledig PV en dossier. De OM-richtlijn zegt: verdachte in beginsel voorgeleiden bij vuurwapen(s). Leg bedenkelijke omstandigheden vast, want die verhogen de strafeis.", "De officier van justitie beslist over vervolging."],
        ["Munitie of onderdelen zonder wapen", "PV of dossier, met aantallen, soort en toestand.", "Het OM beslist over de afdoening."]
      ]],
      ["stap", [
        ["1. Veiligstellen en beslag", "Veiligstellen, vastleggen, beslagtoets, KVI en bewijs van ontvangst. Leg het beslag direct voor aan de hulpofficier of officier van justitie."],
        ["2. Aanhouden of niet", "Aanhouden is een bevoegdheid, geen plicht. Heterdaad: Sv 53. Buiten heterdaad op bevel van de officier van justitie: Sv 54."],
        ["3. Proces-verbaal", "Sv 152 lid 1. Beschrijf wat je zelf zag: waar het lag, in welke staat, wie wat zei, welk voorwerp en welke categorie (voorlopig). Noteer de bedenkelijke omstandigheden en wat strafverminderend is."],
        ["4. Dossier voor justitie", "Volledig PV en dossier, voorgeleiding, foto’s, het beslag met KVI en een deskundigenmening over classificatie of gebruiksklaar zijn als dat speelt."],
        ["5. Overdracht", "Leg overdracht, opslaglocatie en de beslissing van de hulpofficier of officier van justitie vast. De officier van justitie beslist later over teruggave of vernietiging."]
      ]],
      ["p", "<b>Noteer in het proces-verbaal</b> de omstandigheden die volgens de OM-richtlijn de strafeis verhogen (bedenkelijke omstandigheden):"],
      ["ul", ["meerdere wapens, munitie of onderdelen", "op een vliegveld of aan boord van een vliegtuig", "bij een evenement of een voetbalwedstrijd", "een geladen wapen, een geluiddemper, of munitie die bij het wapen past (en ten laste gelegd)", "een wapen onder handbereik in een voertuig, of gedragen in het openbaar (straat, winkel, openbaar gebouw, openbaar vervoer)", "terroristisch oogmerk (WWM 55 lid 5): maatwerk"]],
      ["p", "Strafverminderend is dat het wapen niet gebruiksklaar is en niet met eenvoudige hulpmiddelen weer bruikbaar te maken is. Noteer dit in het proces-verbaal, bij voorkeur met de mening van een deskundige. De richtlijn geldt voor meerderjarigen."],
      ["ul", ["<b>Recidive</b>: de strafeis wordt hoger als de verdachte eerder is veroordeeld. De OM-richtlijn kent een recidivetermijn van 5 jaar (2 jaar bij andere categorieën). Bij recidive geldt het taakstrafverbod van Sr 22b."]]
    ] },
    { h: "9. Vaak mis", b: [
      ["tab", ["Fout", "Juiste aanpak"], [
        ["Wapen in beslag, geen PV of digibon", "Beslag vervangt het PV niet (Sv 152). Alleen het OM kan afzien van vervolging (Sv 167 lid 2)."],
        ["Een gebruikt keukenmes is altijd verboden", "Beoordeel categorie IV en het dragen apart. Ook zonder WWM-feit kan het mes bewijs zijn (Sv 94)."],
        ["Kleur of verkooplabel bepaalt de categorie", "Kijk naar vorm, maat, bouw en werking."],
        ["Nepwapen onderschatten", "Behandel altijd als echt."],
        ["Dragen en voorhanden verwarren", "Kofferbak is voorhanden, middenconsole is dragen."],
        ["E900 voor een knuppel in de kofferbak", "E900 gaat over dragen."],
        ["Minderjarige een digibon geven", "Volgens de werkafspraak is aanhouden de route."],
        ["Een wapen in de auto betekent beslag op de auto", "Twee besluiten. Voor het voertuig heb je een eigen reden, bevoegdheid, noodzaak en verhouding nodig."],
        ["Veiligmaken zonder bewijsplan", "Veiligheid gaat voor. Laat bevoegd personeel handelen en leg toestand, inhoud, sporen en overdracht vast."],
        ["“Even meenemen” zonder beslag", "Ook kort beslag is beslag: reden, bevoegdheid, verhouding, KVI, ontvangstbewijs en directe toets."],
        ["Vrijwillige afgifte noemen als beslag", "Leg de vrijwillige overdracht apart vast, zonder KVI."],
        ["Zoeken volgt automatisch uit WWM 52", "WWM 52 lid 1 gaat over beslag. Kies de juiste WWM- of Sv-bevoegdheid voor fouilleren, betreden of doorzoeken."],
        ["Afstand vervangt de beslaggrond", "Afstand na beslag moet schriftelijk en vervangt de grondslag voor beslag niet."],
        ["Alleen WWM aanpakken", "Denk ook aan bedreiging, afpersing of overval (Sr 285, Sr 317, Sr 312)."],
        ["Reden van wetenschap vergeten", "Hoe en waar aangetroffen, dragen of voorhanden, en wie het veiligstelde."]
      ]]
    ] }
  ],

    if (!hits.length) card.innerHTML = "<p>Niets gevonden. Probeer een korter woord, bijvoorbeeld &lsquo;24 uur&rsquo; of &lsquo;lijst II&rsquo;.</p>";
    hits.slice(0, 30).forEach(function (h) {
      var M = h[0], t = h[3].length > 220 ? h[3].slice(0, 220) + "…" : h[3];
      card.innerHTML += '<div class="res"><div class="sec">' + esc(M.titel) + " · " + esc(h[1]) + '</div><b><a href="' + h[4] + "/" + M.id + '.html">' + hl(h[2], terms) + "</a></b><span>" + hl(t, terms) + "</span></div>";
    });
    box.appendChild(card);
  }
  function hub(root) {
    var w = el("div", "wrap wide");
    var hero = el("div", "hero");
    hero.innerHTML = '<div class="crumb"><span class="rk">' + (BOOK ? BOOK.tag : "Intern document") + "</span></div><h1>" + BNAME + '</h1><p class="sub">' + (BOOK ? BOOK.sub : "Intern naslagwerk voor ons team. Per onderdeel een leerdocument en een spiekbriefje, met beslisbomen, flitskaarten en zelftoetsen.") + "</p>";
    w.appendChild(hero);
    var sb = el("div", "sb", '<input id="hq" type="search" placeholder="Zoek in alle onderdelen, bijv. 9 uur, lijst II, wapenstok, heterdaad" autocomplete="off" aria-label="Zoeken in het hele handboek"><button id="hx" aria-label="Wis zoekopdracht" style="display:none">&times;</button>');
    w.appendChild(sb);
    var nCards = 0; mods().forEach(function (M) { nCards += (M.spiek && M.spiek.flits) ? M.spiek.flits.length : 0; });
    var sres = el("div"); sres.id = "sres"; w.appendChild(sres);
    var grid = el("div"); grid.id = "grid"; w.appendChild(grid);
    var all = mods();
    var mode = sget("home:mode", "leren"); if (["leren", "spiek", "boom"].indexOf(mode) < 0) mode = "leren";
    var openR = null;
    var tasks = el("div", "tks");
    grid.appendChild(el("h2", "hh", "Wat wil je doen?"));
    grid.appendChild(tasks);
    var tiles = el("div", "rts");
    grid.appendChild(el("h2", "hh", "Kies een reeks"));
    grid.appendChild(tiles);
    var panel = el("div", "rp"); grid.appendChild(panel);
    var TASKS = [["leren", "<svg viewBox=\"0 0 24 24\" width=\"28\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z\"/><path d=\"M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5\"/><path d=\"M9 8h7\"/></svg>", "Leren", "Leerdocumenten"], ["spiek", "<svg viewBox=\"0 0 24 24\" width=\"28\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"/><path d=\"M9 4V3h6v1\"/><path d=\"M8.5 10.5l1.5 1.5 2.5-3\"/><path d=\"M8.5 16.5h7\"/></svg>", "Spiekbriefjes", "Kort, op straat"], ["boom", "<svg viewBox=\"0 0 24 24\" width=\"28\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"5\" r=\"2\"/><circle cx=\"5.5\" cy=\"19\" r=\"2\"/><circle cx=\"18.5\" cy=\"19\" r=\"2\"/><path d=\"M12 7v4M12 11l-6 6M12 11l6 6\"/></svg>", "Beslisbomen", "Wat doe ik nu?"], ["flits", "<svg viewBox=\"0 0 24 24\" width=\"28\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3.5\" y=\"7\" width=\"12\" height=\"14\" rx=\"2\"/><path d=\"M8 7V5a2 2 0 0 1 2-2h8.5a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H16\"/><path d=\"M7 12h5M7 15.5h3\"/></svg>", "Flitskaarten", nCards + " kaarten"]];
    function target(M) { return (mode === "leren" ? "leren/" + M.id + ".html" : "spiek/" + M.id + ".html" + (mode === "boom" ? "#boom" : "")); }
    function rowEl(M) {
      var other = mode === "leren" ? ["spiek/" + M.id + ".html", "Spiek"] : ["leren/" + M.id + ".html", "Leren"];
      return el("div", "qrow", '<a class="qmain" href="' + target(M) + '"><span class="qn">' + M.nr + '</span><span class="qt">' + esc(M.titel) + "</span></a>" + '<a class="qalt" href="' + other[0] + '">' + other[1] + "</a>");
    }
    function usable(m) { return mode !== "boom" || (m.spiek && m.spiek.boom); }
    var CAP = { leren: "Tik op een onderdeel om het leerdocument te openen.", spiek: "Tik op een onderdeel om het spiekbriefje te openen.", boom: "Tik op een onderdeel om de beslisboom te openen." };
    var tpanel = el("div", "rp tp"); tasks.parentNode.insertBefore(tpanel, tasks.nextSibling);
    var tOpen = FLAT;
    function drawTPanel() {
      tpanel.innerHTML = ""; tpanel.style.display = tOpen ? "" : "none";
      if (!tOpen) return;
      var g = el("div", "rpi");
      g.appendChild(el("p", "small rpc", CAP[mode]));
      [1, 2, 3, 4].forEach(function (r) {
        var list = all.filter(function (m) { return m.reeks === r && usable(m); });
        if (!list.length) return;
        var sec = el("div", "r" + r);
        if (!FLAT) sec.appendChild(el("div", "qh", "Reeks " + r + " · " + REEKS[r][0]));
        list.forEach(function (M) { sec.appendChild(rowEl(M)); });
        g.appendChild(sec);
      });
      tpanel.appendChild(g);
    }
    function drawPanel() {
      panel.innerHTML = ""; panel.style.display = openR ? "" : "none";
      if (!openR) return;
      var list = all.filter(function (m) { return m.reeks === openR && usable(m); });
      var g = el("div", "rpi r" + openR);
      g.appendChild(el("div", "qh", "Reeks " + openR + " · " + REEKS[openR][0]));
      g.appendChild(el("p", "small rpc", CAP[mode]));
      if (!list.length) g.appendChild(el("p", "small", "Geen beslisboom in deze reeks. Kies Leren of Spiekbriefjes."));
      list.forEach(function (M) { g.appendChild(rowEl(M)); });
      panel.appendChild(g);
    }
    function drawTasks() {
      tasks.innerHTML = "";
      TASKS.forEach(function (T) {
        var a = el(T[0] === "flits" ? "a" : "button", "tk" + (T[0] === mode ? " on" : ""), '<span class="ti">' + T[1] + '</span><b>' + T[2] + "</b><small>" + T[3] + "</small>");
        if (T[0] === "flits") a.href = "oefenen.html";
        else { a.setAttribute("aria-pressed", T[0] === mode ? "true" : "false"); a.onclick = function () { var same = (mode === T[0]); mode = T[0]; sset("home:mode", mode); tOpen = FLAT ? true : (same ? !tOpen : true); drawTasks(); drawTPanel(); drawPanel(); if (tOpen) tpanel.scrollIntoView({ behavior: "smooth", block: "nearest" }); }; }
        tasks.appendChild(a);
      });
    }
    [1, 2, 3, 4].forEach(function (r) {
      var n = all.filter(function (m) { return m.reeks === r; }).length;
      if (!n) return;
      var b = el("button", "rt r" + r, '<span class="rn">REEKS ' + r + '</span><b>' + REEKS[r][0] + "</b><small>" + n + " onderdelen &darr;</small>");
      b.onclick = function () { openR = (openR === r ? null : r); Array.prototype.forEach.call(tiles.children, function (c) { c.classList.remove("on"); }); if (openR) b.classList.add("on"); drawPanel(); if (openR) panel.scrollIntoView({ behavior: "smooth", block: "nearest" }); };
      tiles.appendChild(b);
    });
    if (FLAT) { var hd = tiles.previousSibling; if (hd && hd.parentNode) hd.parentNode.removeChild(hd); tiles.parentNode.removeChild(tiles); panel.parentNode.removeChild(panel); }
    drawTasks(); drawTPanel(); drawPanel();
    foot(w);
    root.appendChild(w);
    var hq = $("hq"), hx = $("hx");
    function run() { var v = hq.value.trim(); hx.style.display = hq.value ? "block" : "none"; grid.style.display = v ? "none" : ""; sres.innerHTML = ""; if (v) hubSearch(sres, v); }
    hq.addEventListener("input", run); hx.onclick = function () { hq.value = ""; run(); hq.focus(); };
    up();
  }

  /* ---------- oefenen: alle flitskaarten door elkaar ---------- */
  function oefen(root) {
    var w = el("div", "wrap"), top = el("div", "top");
    top.appendChild(el("div", "crumb", '<a href="index.html">' + BNAME + '</a><span>/</span><span class="rk">Oefenen</span>'));
    top.appendChild(el("h1", "", "Alle flitskaarten"));
    top.appendChild(el("p", "sub", "Alle onderdelen door elkaar. Je voortgang is dezelfde als bij de flitskaarten per onderdeel."));
    w.appendChild(top);
    var box = el("div"); w.appendChild(box); foot(w); root.appendChild(w); up();
    var all = [];
    mods().forEach(function (M) { if (M.spiek && M.spiek.flits) M.spiek.flits.forEach(function (c, i) { all.push({ M: M, i: i, c: c }); }); });
    var filt = "all", deck = null, flip = false;
    function isKnown(x) { return !!sget(x.M.id + ":known", {})[x.i]; }
    function inFilt(x) { return filt === "all" || (filt.charAt(0) === "r" && String(x.M.reeks) === filt.slice(1)) || (filt.charAt(0) === "m" && x.M.id === filt); }
    function build() {
      deck = all.filter(function (x) { return inFilt(x) && !isKnown(x); });
      for (var i = deck.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), s = deck[i]; deck[i] = deck[j]; deck[j] = s; }
      flip = false;
    }
    function chip(parent, label, key) {
      var b = el("button", "", esc(label)); b.type = "button"; b.setAttribute("aria-pressed", filt === key ? "true" : "false");
      b.onclick = function () { filt = key; deck = null; draw(); }; parent.appendChild(b);
    }
    function draw() {
      if (!deck) build();
      box.innerHTML = "";
      var c1 = el("div", "chips"); chip(c1, "Alles", "all"); if (!FLAT) [1, 2, 3, 4].forEach(function (r) { chip(c1, "Reeks " + r + " · " + REEKS[r][0], "r" + r); }); box.appendChild(c1);
      var c2 = el("div", "selrow");
      var sl = document.createElement("select"); sl.className = "msel"; sl.setAttribute("aria-label", "Kies een onderdeel");
      var o0 = document.createElement("option"); o0.value = ""; o0.textContent = "Kies een onderdeel"; sl.appendChild(o0);
      mods().forEach(function (M) { var o = document.createElement("option"); o.value = M.id; o.textContent = M.nr + " · " + M.titel; if (filt === M.id) o.selected = true; sl.appendChild(o); });
      if (filt.charAt(0) !== "m") o0.selected = true;
      sl.onchange = function () { filt = sl.value || "all"; deck = null; draw(); };
      c2.appendChild(sl); box.appendChild(c2);
      var sel = all.filter(inFilt), done = sel.filter(isKnown).length;
      if (!deck.length) {
        box.appendChild(el("div", "card", "<h2>Alles gehaald</h2><p>Je hebt alle " + sel.length + " kaarten in deze selectie als bekend gemarkeerd.</p>"));
        var r = el("button", "btn", "Begin opnieuw"); r.onclick = function () { sel.forEach(function (x) { var k = sget(x.M.id + ":known", {}); delete k[x.i]; sset(x.M.id + ":known", k); }); deck = null; draw(); }; box.appendChild(r); return;
      }
      box.appendChild(el("p", "small", done + " van " + sel.length + " bekend · nog " + deck.length + " te gaan"));
      var x = deck[0];
      var b = el("button", "fl r" + x.M.reeks, '<div class="small" style="margin-bottom:6px;font-weight:700;text-transform:uppercase">Onderdeel ' + x.M.nr + " · " + esc(x.M.titel) + " · " + esc(x.c[0]) + '</div><div class="q">' + lk(x.c[1]) + "</div>" + (flip ? '<div class="a">' + lk(x.c[2]) + "</div>" : '<div class="hint">Denk eerst. Tik voor het antwoord.</div>'));
      b.onclick = function () { flip = !flip; draw(); }; box.appendChild(b);
      var ctl = el("div", "ctl");
      var no = el("button", "", "Nog niet"); no.onclick = function () { deck.push(deck.shift()); flip = false; draw(); };
      var yes = el("button", "go", "Wist ik"); yes.onclick = function () { var k = sget(x.M.id + ":known", {}); k[x.i] = true; sset(x.M.id + ":known", k); deck.shift(); flip = false; draw(); };
      ctl.appendChild(no); ctl.appendChild(yes); box.appendChild(ctl);
      var sk = el("button", "btn", "Schudden"); sk.style.marginTop = "10px"; sk.onclick = function () { deck = null; draw(); }; box.appendChild(sk);
    }
    draw();
  }


  /* ---------- menu bovenin: alle onderdelen, uitklapbaar ---------- */
  function menu(mode, cur) {
    var items = (window.MENU || mods()).slice().sort(function (a, b) { return a.nr - b.nr; });
    if (!items.length) return;
    var p = (mode === "hub" || mode === "oefen") ? "" : "../";
    var bar = el("div", "mbar");
    var inner = el("div", "mbar-in");
    var btn = el("button", "mbtn", '<span class="mic" aria-hidden="true"></span><span>Menu</span>');
    btn.setAttribute("aria-expanded", "false"); btn.setAttribute("aria-controls", "mpanel");
    var home = el("a", "mhome", BNAME); home.href = p + "index.html";
    inner.appendChild(btn); inner.appendChild(home); bar.appendChild(inner);
    var panel = el("nav", "mpanel"); panel.id = "mpanel"; panel.hidden = true; panel.setAttribute("aria-label", "Alle onderdelen");
    var top = el("div", "mtop");
    top.innerHTML = '<a href="' + p + 'index.html">Overzicht</a><a href="' + p + 'oefenen.html">Alle flitskaarten</a>';
    panel.appendChild(top);
    [1, 2, 3, 4].forEach(function (r) {
      var list = items.filter(function (m) { return m.reeks === r; });
      if (!list.length) return;
      var g = el("div", "mg r" + r);
      if (!FLAT) g.appendChild(el("div", "mgh", "Reeks " + r + " · " + REEKS[r][0]));
      list.forEach(function (M) {
        var d = document.createElement("details"); d.className = "md";
        if (M.id === cur) { d.open = true; d.className += " cur"; }
        var s = document.createElement("summary");
        s.innerHTML = '<span class="qn">' + M.nr + "</span><span>" + esc(M.titel) + "</span>";
        d.appendChild(s);
        d.appendChild(el("div", "ml", '<a href="' + p + "leren/" + M.id + '.html">Leerdocument</a><a href="' + p + "spiek/" + M.id + '.html">Spiekbriefje</a>'));
        g.appendChild(d);
      });
      panel.appendChild(g);
    });
    bar.appendChild(panel);
    document.body.insertBefore(bar, document.body.firstChild);
    function set(open) { panel.hidden = !open; btn.setAttribute("aria-expanded", open ? "true" : "false"); document.body.classList.toggle("mopen", open); }
    btn.onclick = function () { set(panel.hidden); };
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && !panel.hidden) { set(false); btn.focus(); } });
    document.addEventListener("click", function (ev) { if (!panel.hidden && !bar.contains(ev.target)) set(false); });
  }

  /* ---------- start ---------- */
  function curMod() {
    var all = mods();
    if (window.CURID) for (var i = 0; i < all.length; i++) if (all[i].id === window.CURID) return all[i];
    return all[0];
  }
  /* alles-in-een-bestand: routering via #-adres */
  function route() {
    if (!window.SINGLE) return;
    var h = location.hash.slice(1).split("/");
    if ((h[0] === "leren" || h[0] === "spiek") && h[1]) { window.MODE = h[0]; window.CURID = h[1]; }
    else if (h[0] === "oefen") { window.MODE = "oefen"; window.CURID = null; }
    else { window.MODE = "hub"; window.CURID = null; }
    var M = window.CURID ? curMod() : null;
    document.body.className = M ? "r" + M.reeks : "";
  }
  function start() {
    route();
    var root = $("app"), mode = window.MODE;
    menu(mode, mode === "leren" || mode === "spiek" ? (curMod() || {}).id : null);
    if (mode === "hub") return hub(root);
    if (mode === "oefen") return oefen(root);
    var M = curMod();
    if (mode === "leren") leren(root, M); else spiek(root, M);
  }
  function restart() {
    $("app").innerHTML = "";
    var bar = document.querySelector(".mbar"); if (bar) bar.remove();
    var u = $("up"); if (u) u.remove();
    document.body.classList.remove("mopen");
    start(); window.scrollTo(0, 0);
  }
  if (window.SINGLE) {
    window.addEventListener("hashchange", restart);
    document.addEventListener("click", function (ev) {
      var a = ev.target.closest ? ev.target.closest("a[href]") : null;
      if (!a || ev.defaultPrevented || ev.metaKey || ev.ctrlKey || ev.shiftKey || a.target === "_blank") return;
      var h = a.getAttribute("href"), m;
      if (/^https?:/.test(h)) return;
      if ((m = h.match(/(leren|spiek)\/(m\d+)\.html(?:#(\w+))?$/))) { ev.preventDefault(); location.hash = m[1] + "/" + m[2] + (m[3] ? "/" + m[3] : ""); }
      else if (/oefenen\.html$/.test(h)) { ev.preventDefault(); location.hash = "oefen"; }
      else if (/index\.html$/.test(h)) { ev.preventDefault(); location.hash = ""; if (!location.hash) restart(); }
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();

</script>
